[workspace]
authors = ["Mike Martinez <mike.j.martinez99@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "cellbender"
platforms = ["linux-64"]
version = "0.1.0"

# GPU build of PyTorch. Requires an NVIDIA driver that supports CUDA 12 on the
# node where the env is solved/run. Remove this block (and pytorch-gpu below)
# for a CPU-only env.
[system-requirements]
cuda = "12"

[activation.env]
# Lets `pixi install` run on a login node with no GPU driver visible
CONDA_OVERRIDE_CUDA = "12.0"

[tasks]

[dependencies]
python = "3.11.*"
pip = "*"
ipykernel = "*"
# core numerical / IO stack (conda builds so pip does not pull its own torch)
pytorch-gpu = ">=2.0"
pyro-ppl = ">=1.8.4"
numpy = "<2.1"
scipy = "*"
pandas = "*"
scikit-learn = "*"
matplotlib = "*"
anndata = ">=0.9"
pytables = "*"
h5py = "*"
psutil = "*"
loompy = ">=3.0.8,<4"
dill = ">0.3.1"
# needed for the HTML report that remove-background writes
nbconvert = "*"
ipython = "*"

[pypi-dependencies]
cellbender = "==0.4.0"
