# On linux-64 the default PyPI torch wheel drags in ~3 GB of nvidia-*/CUDA wheels,
# which is what blew out the home-directory quota on Discovery. Only tangram-sc uses
# torch here, and it runs fine on CPU. For a GPU node, delete this block.
[target.linux-64.pypi-dependencies]
torch = { version = ">=2.5", index = "https://download.pytorch.org/whl/cpu" }
