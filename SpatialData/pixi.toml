# =====================================================================================
# spatialData — pixi manifest (converted from the `spatial` conda environment export)
# =====================================================================================
# Conversion notes:
#   * The source `conda env export` was a full solve (~250 packages), most of which are
#     transitive. A pixi manifest lists *direct* dependencies; `pixi.lock` records the
#     full resolved graph. Only roots are listed here.
#   * The source env is layered: an old (2024) conda base with a much newer (2026) pip
#     layer installed on top. The pip layer is the real environment — numpy, pandas,
#     scipy, matplotlib, scikit-learn etc. are all pip-provided and shadow conda.
#     Everything scientific therefore lives in [pypi-dependencies] under one resolver,
#     with the conda layer kept to the interpreter. This avoids conda/pypi shadowing.
#   * pip pins are carried over verbatim (`==`) so this reproduces the working env.
#   * Three packages were bumped because their exported versions cannot coexist with
#     numpy 2.4.6 / anndata 0.12, or because the export was self-contradictory:
#     torch (was pytorch 2.2.0), squidpy (was 1.4.1), leidenalg (was 0.9.1) and
#     napari-spatialdata (was 0.5.0.post0). See the comments inline.
#   * Dropped from the conda layer: the GDAL/GEOS/fiona/pygeos geospatial stack, which
#     is superseded by the pyogrio + shapely + pyproj wheels already in the pip layer.
# =====================================================================================

[workspace]
authors = ["Mike Martinez <mike.j.martinez99@gmail.com>"]
channels = ["conda-forge"]
name = "spatialData"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]


[dependencies]
python = "3.11.*"
pip = "*"

[pypi-dependencies]
torch = ">=2.5"          
squidpy = ">=1.6"
leidenalg = ">=0.10"     
bokeh = "*"
openpyxl = "*"
seaborn = "*"
ipykernel = "*"
omnipath = "*"
folium = "*"
mapclassify = "*"
"rtree" = "*"

# RASP (Randomized Spatial PCA). The repo Goods-Lab/RASP is unmaintained and hard-pins
# numpy==1.26.4 / scanpy==1.10.1, which cannot coexist with this environment. This is the
# maintained fork, published to PyPI with unpinned deps: https://github.com/gingerii/RASP
# Its rpy2/R "mclust" backend is an optional extra and is deliberately NOT installed —
# use RASP.clustering(method="gmm") for the R-free equivalent.
randomized-spatial-pca = ">=0.1.1"
glasbey = "*"                        
esda = "*"                           
